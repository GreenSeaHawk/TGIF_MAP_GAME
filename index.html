
<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Guess the Location</title>

  <!-- ✅ Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    #map {
      height: 500px;
      width: 90%;
      max-width: 900px;
      margin: 20px auto;
      border-radius: 10px;
    }

    input {
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      margin: 10px;
      cursor: pointer;
    }

    #leaderboard {
      margin-top: 20px;
      text-align: left;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>🌍 Guess the Location</h2>
    <p id="clueText"></p>

    <input id="nameInput" placeholder="Enter your name" />

    <div id="map"></div>

    <button id="confirmBtn" onclick="confirmGuess()">✅ Confirm My Guess</button>

    <div id="result"></div>

    <h3>🏆 Leaderboard</h3>
    <div id="leaderboard"></div>

  </div>

  <!-- ✅ Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- ✅ Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ✅ DAILY VALUES
    const clue = "Capital of Alaska";
    const correctLocation = [61.2047228,-149.9192879];
    const quizId = "2026-06-10 Alaska";

    // ✅ SUPABASE
    const SUPABASE_URL = "https://avlxgthluqcqognobjcv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_WB0RzuTp2I6jz4ZwaLq63Q_hjD7Ynsf";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    // Set clue
    document.getElementById("clueText").innerHTML =
      "<b>Clue:</b> " + clue;

    let guessCoords = null;
    let guessMarker = null;
    let answerMarker = null;
    let line = null;
    let hasGuessed = false;

    // ✅ MAP INITIALISATION
    const map = L.map('map', {
      worldCopyJump: false,
      maxBounds: [[-90, -180], [90, 180]],
      maxBoundsViscosity: 1.0
    }).setView([20, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      noWrap: true
    }).addTo(map);

    // Click map
    map.on('click', function (e) {
      if (hasGuessed) return;

      guessCoords = [e.latlng.lat, e.latlng.lng];

      if (guessMarker) map.removeLayer(guessMarker);

      guessMarker = L.marker(guessCoords).addTo(map)
        .bindPopup("Your guess")
        .openPopup();

      document.getElementById("result").innerHTML =
        "📍 Guess placed. Click confirm when ready!";
    });

    // ✅ FIXED: wrapped line calculation
    function getWrappedCoords(a, b) {
      let [lat1, lng1] = a;
      let [lat2, lng2] = b;

      let diff = lng2 - lng1;

      // adjust if crossing dateline
      if (Math.abs(diff) > 180) {
        if (diff > 0) {
          lng1 += 360;
        } else {
          lng2 += 360;
        }
      }

      return [
        [lat1, lng1],
        [lat2, lng2]
      ];
    }

    // Confirm guess
    async function confirmGuess() {
      if (hasGuessed) return;

      const name = document.getElementById("nameInput").value.trim();

      if (!name) {
        document.getElementById("result").innerHTML =
          "❗ Please enter your name!";
        return;
      }

      if (!guessCoords) {
        document.getElementById("result").innerHTML =
          "❗ Please click the map first!";
        return;
      }

      // Check unique name
      const { data: existing } = await supabaseClient
        .from('guesses')
        .select('name')
        .eq('name', name)
        .eq('quiz_id', quizId);

      if (existing && existing.length > 0) {
        document.getElementById("result").innerHTML =
          "❗ Name already taken!";
        return;
      }

      hasGuessed = true;

      const distance = getDistance(correctLocation, guessCoords);

      await supabaseClient.from('guesses').insert([
        {
          name: name,
          distance: distance,
          quiz_id: quizId
        }
      ]);

      // markers
      answerMarker = L.marker(correctLocation).addTo(map);

      // ✅ FIXED LINE - split across dateline with interpolated latitude
      const guessLng = guessCoords[1];
      const correctLng = correctLocation[1];
      const guessLat = guessCoords[0];
      const correctLat = correctLocation[0];
      const diff = correctLng - guessLng;
      
      if (Math.abs(diff) > 180) {
        // Crosses dateline, interpolate latitude at the crossing
        let latAtEdge;
        let seg1, seg2;
        
        if (diff > 180) {
          // Shortest path goes west (wraps westward)
          const effectiveDiff = diff - 360;
          const distToWest = -180 - guessLng;
          const fraction = distToWest / effectiveDiff;
          latAtEdge = guessLat + (correctLat - guessLat) * fraction;
          
          seg1 = [[guessLat, guessLng], [latAtEdge, -180]];
          seg2 = [[latAtEdge, 180], [correctLat, correctLng]];
        } else {
          // diff < -180, shortest path goes east (wraps eastward)
          const effectiveDiff = diff + 360;
          const distToEast = 180 - guessLng;
          const fraction = distToEast / effectiveDiff;
          latAtEdge = guessLat + (correctLat - guessLat) * fraction;
          
          seg1 = [[guessLat, guessLng], [latAtEdge, 180]];
          seg2 = [[latAtEdge, -180], [correctLat, correctLng]];
        }
        
        line = L.polyline(seg1).addTo(map);
        L.polyline(seg2).addTo(map);
      } else {
        // Normal case, no dateline crossing
        line = L.polyline([
          [guessLat, guessLng],
          [correctLat, correctLng]
        ]).addTo(map);
      }

      // ✅ nice zoom (optional)
      const group = new L.featureGroup([guessMarker, answerMarker]);
      map.fitBounds(group.getBounds(), { padding: [50, 50] });

      // lock UI
      document.getElementById("confirmBtn").disabled = true;

      document.getElementById("result").innerHTML =
        `🎯 You were <b>${formatDistance(distance)}</b> away!`;

      renderLeaderboard();
    }

    // Leaderboard
    async function renderLeaderboard() {
      const { data } = await supabaseClient
        .from('guesses')
        .select('*')
        .eq('quiz_id', quizId)
        .order('distance', { ascending: true });

      let html = "<ol>";

      data?.forEach(entry => {
        html += `<li>${entry.name} - ${formatDistance(entry.distance)}</li>`;
      });

      html += "</ol>";

      document.getElementById("leaderboard").innerHTML = html;
    }

    renderLeaderboard();

    // Distance calc
    function getDistance(a, b) {
      const R = 6371;

      const dLat = (b[0] - a[0]) * Math.PI / 180;
      const dLon = (b[1] - a[1]) * Math.PI / 180;

      const lat1 = a[0] * Math.PI / 180;
      const lat2 = b[0] * Math.PI / 180;

      const x = Math.sin(dLat / 2) ** 2 +
        Math.sin(dLon / 2) ** 2 * Math.cos(lat1) * Math.cos(lat2);

      const y = 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));

      return R * y;
    }

    function formatDistance(d) {
      return d < 1
        ? Math.round(d * 1000) + " metres"
        : Math.round(d) + " km";
    }

  </script>

</body>

</html>
